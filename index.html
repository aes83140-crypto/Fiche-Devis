<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outils techniciens — RECORD</title>
<style>
  :root{
    --paper:#FAF8F3;
    --paper-dim:#F0ECE2;
    --ink:#1C2024;
    --ink-soft:#5B6570;
    --steel:#33495C;
    --line:#C9CFC0;
    --mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --disp:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper-dim);}
  body{font-family:var(--sans);color:var(--ink);padding:20px 16px calc(40px + env(safe-area-inset-bottom));min-height:100vh;}
  .fd-wrap{max-width:640px;margin:0 auto;}

  .fd-ticket{background:var(--steel);color:var(--paper);padding:26px 26px 30px;position:relative;border-radius:6px 6px 0 0;}
  .fd-ticket::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:18px;background:radial-gradient(circle at 10px 0, transparent 9px, var(--steel) 9.5px) top left/20px 18px repeat-x;}
  .fd-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C7D3DA;margin-bottom:8px;}
  .fd-title{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase;margin:0;}
  .fd-sub{font-size:14px;color:#B9C6CD;margin-top:4px;}

  .fd-body{background:var(--paper);padding:28px 22px 22px;border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;}

  .fd-card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:22px 20px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:16px;
    transition:border-color .15s, transform .1s;
  }
  .fd-card:active{transform:scale(.98);}
  .fd-card:hover{border-color:var(--steel);}
  .fd-card-icon{
    font-size:32px;
    width:56px;height:56px;
    flex-shrink:0;
    background:var(--paper-dim);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .fd-card-title{
    font-family:var(--disp);
    font-weight:700;
    font-size:17px;
    letter-spacing:.01em;
    color:var(--steel);
    margin-bottom:4px;
  }
  .fd-card-desc{font-size:13px;color:var(--ink-soft);line-height:1.4;}
  .fd-card-arrow{margin-left:auto;font-size:20px;color:var(--line);flex-shrink:0;}

  .fd-footer-credit{text-align:center;max-width:640px;margin:30px auto 8px;padding:14px 0 0;border-top:1px solid var(--line);}
  .fd-footer-credit .fd-credit-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .fd-footer-credit .fd-credit-name{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.03em;color:var(--steel);}
</style>
</head>
<body>

<div class="fd-wrap">
  <div class="fd-ticket">
    <div class="fd-eyebrow">RECORD · MAINTENANCE TRAVAUX</div>
    <div class="fd-title">Outils techniciens</div>
    <div class="fd-sub">Choisis la fiche à remplir</div>
  </div>

  <div class="fd-body">
    <a class="fd-card" href="fiche-devis.html">
      <div class="fd-card-icon">📋</div>
      <div>
        <div class="fd-card-title">Fiche devis</div>
        <div class="fd-card-desc">Relevé technicien pour une demande de devis — photos, PDF, envoi mail direct.</div>
      </div>
      <div class="fd-card-arrow">›</div>
    </a>

    <a class="fd-card" href="vantaux-sav.html">
      <div class="fd-card-icon">🚪</div>
      <div>
        <div class="fd-card-title">Descriptif vantaux SAV</div>
        <div class="fd-card-desc">Vantail ou fixe cassé — configuration, cotes, profilé alu, schéma.</div>
      </div>
      <div class="fd-card-arrow">›</div>
    </a>
  </div>
</div>

<div class="fd-footer-credit">
  <div class="fd-credit-label">Réalisation</div>
  <div class="fd-credit-name">Christophe BATAILLE</div>
</div>

</body>
</html>
