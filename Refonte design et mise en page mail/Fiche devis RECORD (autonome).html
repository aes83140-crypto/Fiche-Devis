  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Demande de devis — RECORD<\u002Ftitle>\n<script src=\"6d267509-a5c7-4805-8e59-0db1200d1555\"><\u002Fscript>\n<script>\n  window.addEventListener('error', function(e){\n    var b = document.createElement('div');\n    b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B3403A;color:#fff;padding:10px 14px;font-size:13px;z-index:99999;font-family:sans-serif;line-height:1.4;';\n    b.textContent = 'Erreur technique : ' + e.message + ' (ligne ' + e.lineno + ')';\n    document.body.appendChild(b);\n  });\n<\u002Fscript>\n<style>\n  :root{\n    --bg:#EDEFF3;\n    --surface:#FFFFFF;\n    --surface-2:#F6F8FA;\n    --ink:#12171C;\n    --ink-soft:#5A646E;\n    --ink-mute:#8A939C;\n    --steel:#1E3448;\n    --steel-2:#2F5674;\n    --steel-soft:#E9EEF3;\n    --line:#E3E6EB;\n    --line-2:#CCD3DB;\n    --amber:#C8811A;\n    --amber-dark:#9A6210;\n    --amber-soft:#FCF3E2;\n    --red:#B3403A;\n    --red-bg:#FBEAE8;\n    --green:#3F7A46;\n    --green-bg:#E9F1EA;\n    --paper:#FFFFFF;\n    --paper-dim:#EDEFF3;\n    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;\n    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\n    --disp:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\n    --r:16px;\n    --shadow:0 1px 2px rgba(18,23,28,.05),0 12px 30px -20px rgba(18,23,28,.45);\n  }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\n  html,body{margin:0;padding:0;background:var(--bg);}\n  body{\n    font-family:var(--sans);\n    color:var(--ink);\n    -webkit-font-smoothing:antialiased;\n    line-height:1.45;\n    padding:18px 14px calc(48px + env(safe-area-inset-bottom));\n    min-height:100vh;\n  }\n  .fd-wrap{max-width:780px;margin:0 auto;}\n  a{color:var(--steel-2);}\n  a:hover{color:var(--steel);}\n\n  /* ---------- En-tête ---------- */\n  .fd-ticket{\n    background:var(--steel);\n    color:#fff;\n    padding:26px 24px 26px;\n    position:relative;\n    border-radius:20px;\n    box-shadow:0 18px 40px -26px rgba(18,23,28,.75);\n    overflow:hidden;\n  }\n  .fd-ticket::after{content:none;}\n  .fd-ticket::before{\n    content:\"\";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber);\n  }\n  .fd-eyebrow{\n    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;\n    color:rgba(255,255,255,.62);display:flex;justify-content:space-between;align-items:center;\n    gap:12px;margin-bottom:14px;\n  }\n  .fd-eyebrow span:last-child{\n    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);\n    padding:5px 11px;border-radius:999px;letter-spacing:.06em;color:#fff;white-space:nowrap;\n  }\n  .fd-eyebrow span:only-child{background:none;border:none;padding:0;}\n  .fd-title{\n    font-family:var(--disp);font-weight:700;font-size:27px;line-height:1.15;\n    letter-spacing:-.015em;text-transform:none;margin:0;max-width:92%;\n  }\n  .fd-sub{font-size:14.5px;color:rgba(255,255,255,.68);margin-top:7px;}\n\n  .fd-admin-btn{\n    position:absolute;top:20px;right:20px;width:42px;height:42px;border-radius:13px;\n    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;\n    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;\n  }\n  .fd-admin-btn:active{background:rgba(255,255,255,.18);}\n\n  /* ---------- Corps : sections en cartes ---------- */\n  .fd-body{background:transparent;padding:18px 0 0;border:none;border-radius:0;}\n\n  .fd-section{\n    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);\n    padding:22px 20px;margin-bottom:14px;box-shadow:var(--shadow);\n  }\n  .fd-section-head{\n    display:flex;align-items:center;gap:12px;margin:0 0 20px;\n    padding-bottom:14px;border-bottom:1px solid var(--line);\n  }\n  .fd-num{\n    font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--steel);\n    background:var(--steel-soft);width:30px;height:30px;border-radius:10px;\n    display:flex;align-items:center;justify-content:center;flex-shrink:0;\n  }\n  .fd-section-title{\n    font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em;\n    text-transform:none;color:var(--ink);\n  }\n\n  .fd-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}\n  .fd-field{margin-bottom:0;}\n  .fd-field.full{grid-column:1/-1;}\n  label{\n    display:block;font-size:11.5px;font-weight:700;color:var(--ink-mute);\n    text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;\n  }\n  label .req{color:var(--red);}\n\n  input[type=text],input[type=email],input[type=date],input[type=number],textarea,select{\n    width:100%;font-family:var(--sans);font-size:16.5px;color:var(--ink);background:#fff;\n    border:1.5px solid var(--line-2);border-radius:12px;padding:14px 15px;outline:none;\n    transition:border-color .15s, box-shadow .15s;\n  }\n  input::placeholder,textarea::placeholder{color:var(--ink-mute);}\n  input:focus,textarea:focus,select:focus{\n    border-color:var(--steel-2);box-shadow:0 0 0 4px rgba(47,86,116,.13);\n  }\n  input.fd-mono,select.fd-mono{font-family:var(--mono);letter-spacing:.02em;}\n  textarea{resize:vertical;min-height:110px;line-height:1.5;}\n  select{\n    background-image:url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"%235A646E\" stroke-width=\"2.5\"><polyline points=\"6 9 12 15 18 9\"/><\u002Fsvg>');\n    background-repeat:no-repeat;background-position:right 15px center;background-size:16px;\n    padding-right:40px;appearance:none;-webkit-appearance:none;\n  }\n  .fd-add-row{display:flex;gap:8px;margin-top:8px;}\n  .fd-add-row input{flex:1;}\n  .fd-add-row.hidden{display:none;}\n\n  .fd-toggle-row{display:flex;gap:10px;}\n  .fd-toggle{\n    flex:1;text-align:center;padding:12px 8px;min-height:52px;\n    display:flex;align-items:center;justify-content:center;\n    border:1.5px solid var(--line-2);border-radius:12px;font-size:15px;font-weight:650;\n    cursor:pointer;background:var(--surface-2);color:var(--ink-soft);user-select:none;\n    transition:background .12s,border-color .12s,color .12s;\n  }\n  .fd-toggle.on{\n    background:var(--steel);border-color:var(--steel);color:#fff;\n    box-shadow:0 8px 18px -12px rgba(30,52,72,.9);\n  }\n\n  .fd-chip-row{display:flex;gap:10px;flex-wrap:wrap;}\n  .fd-chip{\n    padding:0 20px;min-height:50px;display:flex;align-items:center;border-radius:999px;\n    border:1.5px solid var(--line-2);background:var(--surface-2);font-size:15px;font-weight:650;\n    cursor:pointer;color:var(--ink-soft);user-select:none;\n  }\n  .fd-chip[data-type=\"arret\"].on,.fd-chip[data-type=\"urgent\"].on{background:var(--red-bg);border-color:var(--red);color:var(--red);}\n  .fd-chip[data-type=\"preventif\"].on{background:var(--green-bg);border-color:var(--green);color:var(--green);}\n\n  .fd-hint,.fd-photo-hint{font-size:12.5px;color:var(--ink-mute);margin-top:8px;line-height:1.5;}\n\n  /* ---------- Alerte ---------- */\n  .fd-alert-box{\n    background:var(--amber-soft);border:1px solid #EBD4A8;border-radius:14px;\n    padding:15px 18px;margin-bottom:14px;text-align:left;\n    font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:0;\n    text-transform:none;color:var(--amber-dark);\n  }\n\n  /* ---------- Cartes visuelles ---------- */\n  .fd-visual-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(134px,1fr));gap:12px;margin-top:4px;}\n  .fd-visual-card{\n    border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);\n    padding:12px 10px;text-align:center;cursor:pointer;user-select:none;\n    transition:border-color .12s,background .12s,transform .1s;\n  }\n  .fd-visual-card:active{transform:scale(.985);}\n  .fd-visual-card.on{border-color:var(--steel-2);background:var(--steel-soft);box-shadow:0 0 0 1.5px var(--steel-2) inset;}\n  .fd-visual-card svg{display:block;margin:0 auto;}\n  .fd-visual-label{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-top:8px;line-height:1.35;}\n  .fd-visual-card.on .fd-visual-label{color:var(--steel);}\n  .fd-visual-code{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);margin-top:6px;}\n  .fd-visual-card.current{border-color:#E7CB97;background:var(--amber-soft);}\n  .fd-visual-card.current.on{border-color:var(--steel-2);background:var(--steel-soft);}\n  .fd-visual-badge{\n    display:inline-block;font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.05em;\n    text-transform:uppercase;color:#fff;background:var(--amber);border-radius:999px;padding:3px 8px;margin-bottom:6px;\n  }\n  .fd-visual-card img{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:8px;background:#fff;}\n\n  /* ---------- Sélection panneau cassé ---------- */\n  .fd-panel-box{\n    border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface-2);\n    padding:18px;margin-top:18px;\n  }\n  .fd-panel-title{\n    font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:none;\n    letter-spacing:0;margin-bottom:14px;text-align:left;\n  }\n  .fd-panel-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start;}\n  .fd-panel-btn{\n    border:1.5px solid var(--line-2);border-radius:12px;background:#fff;padding:13px 15px;\n    min-width:132px;min-height:62px;text-align:left;cursor:pointer;user-select:none;\n    font-size:13px;font-weight:650;color:var(--ink);\n  }\n  .fd-panel-btn .fd-panel-kind{\n    font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);\n    display:block;margin-bottom:5px;font-weight:700;\n  }\n  .fd-panel-btn.broken{background:var(--red-bg);border-color:var(--red);color:var(--red);}\n  .fd-panel-btn.broken .fd-panel-kind{color:var(--red);}\n  .fd-panel-btn.broken::before{content:\"\\2715 CASSÉ  \";font-weight:800;}\n\n  /* ---------- Tableaux profilés ---------- */\n  .fd-profile-table{\n    width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;font-size:13.5px;\n    border:1px solid var(--line);border-radius:12px;overflow:hidden;\n  }\n  .fd-profile-table th,.fd-profile-table td{padding:11px 8px;text-align:center;}\n  .fd-profile-table th{\n    background:var(--surface-2);color:var(--ink-mute);font-weight:700;font-size:10.5px;\n    text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);\n  }\n  .fd-profile-table td{border-bottom:1px solid var(--line);font-family:var(--mono);}\n  .fd-profile-table tr:last-child td{border-bottom:none;}\n  .fd-profile-table td:first-child{font-weight:700;background:transparent;font-family:var(--sans);}\n  .fd-profile-table tr.fd-row-current td:first-child{color:var(--amber-dark);}\n  .fd-profile-table tr.fd-row-selected td{background:var(--steel-soft);}\n  .fd-profile-table tr.fd-row-selected td:first-child{background:var(--steel);color:#fff;}\n  .fd-mini-badge{font-size:9px;font-weight:700;color:var(--amber-dark);text-transform:uppercase;letter-spacing:.06em;}\n\n  .fd-schema-box{\n    border:1px solid var(--line);border-radius:14px;background:var(--surface);\n    padding:18px;margin-bottom:14px;display:flex;justify-content:center;\n  }\n\n  /* ---------- Photos ---------- */\n  .fd-photo-actions{display:block;margin-top:4px;}\n  .fd-photo-btn{\n    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;\n    font-family:var(--sans);font-weight:700;font-size:15px;padding:16px;min-height:68px;\n    border-radius:14px;border:2px dashed var(--line-2);background:var(--surface-2);\n    color:var(--steel);cursor:pointer;text-align:center;\n  }\n  .fd-photo-btn:active{background:var(--steel-soft);}\n  .fd-photo-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(96px,1fr));gap:12px;margin-top:14px;}\n  .fd-photo-thumb{\n    position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);\n    aspect-ratio:1/1;background:var(--surface-2);\n  }\n  .fd-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}\n  .fd-photo-del{\n    position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;\n    background:rgba(18,23,28,.62);color:#fff;border:none;font-size:14px;line-height:1;cursor:pointer;\n  }\n\n  /* ---------- Actions ---------- */\n  .fd-actions{\n    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;\n    padding:18px;border:1px solid var(--line);border-top:1px solid var(--line);\n    border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);\n  }\n  .fd-btn{\n    font-family:var(--sans);font-weight:700;font-size:15.5px;padding:15px 16px;min-height:54px;\n    border-radius:12px;border:1.5px solid var(--steel);background:var(--steel);color:#fff;cursor:pointer;\n  }\n  #btn-mail{grid-column:1/-1;box-shadow:0 10px 22px -14px rgba(30,52,72,.95);}\n  .fd-btn.secondary{background:#fff;color:var(--steel);border-color:var(--line-2);}\n  .fd-btn.ghost{background:transparent;color:var(--ink-mute);border-color:var(--line);}\n  .fd-btn.wide{grid-column:1/-1;}\n  .fd-btn:active{transform:translateY(1px);opacity:.9;}\n\n  .fd-msg{\n    font-family:var(--sans);font-size:15px;font-weight:650;text-align:left;line-height:1.45;\n    margin-top:14px;padding:0;border-radius:14px;max-height:0;overflow:hidden;opacity:0;\n    transition:all .2s ease;\n  }\n  .fd-msg.show{padding:16px 18px;max-height:240px;opacity:1;border:1px solid;box-shadow:var(--shadow);}\n  .fd-msg.error{background:var(--red-bg);color:var(--red);border-color:#E9BEB9;}\n  .fd-msg.success{background:var(--green-bg);color:var(--green);border-color:#C3DAC6;}\n\n  /* ---------- Accueil ---------- */\n  .fd-card{\n    display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;\n    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);\n    padding:20px;margin-bottom:14px;box-shadow:var(--shadow);\n    transition:border-color .15s,transform .12s;\n  }\n  .fd-card:active{transform:scale(.99);}\n  .fd-card:hover{border-color:var(--steel-2);}\n  .fd-card-icon{\n    font-size:26px;width:58px;height:58px;flex-shrink:0;background:var(--steel-soft);\n    border-radius:15px;display:flex;align-items:center;justify-content:center;\n  }\n  .fd-card-title{font-family:var(--disp);font-weight:700;font-size:17.5px;letter-spacing:-.01em;color:var(--ink);margin-bottom:5px;}\n  .fd-card-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}\n  .fd-card-arrow{margin-left:auto;font-size:24px;color:var(--line-2);flex-shrink:0;}\n  .fd-card-main{cursor:pointer;flex:1;min-width:0;}\n  .fd-empty{text-align:center;color:var(--ink-mute);font-size:14px;padding:22px 0;}\n\n  .fd-footer-credit{text-align:center;max-width:780px;margin:26px auto 8px;padding:0;border-top:none;}\n  .fd-footer-credit .fd-credit-label{\n    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);\n  }\n  .fd-footer-credit .fd-credit-name{\n    font-family:var(--disp);font-weight:650;font-size:13.5px;letter-spacing:.01em;color:var(--ink-soft);margin-top:2px;\n  }\n\n  /* ---------- Administration ---------- */\n  .fd-modal{position:fixed;inset:0;background:rgba(12,17,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9000;}\n  .fd-modal.hidden{display:none;}\n  .fd-modal-box{\n    background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;\n    border-radius:24px 24px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));\n  }\n  .fd-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}\n  .fd-modal-head h3{\n    font-family:var(--disp);font-weight:700;font-size:20px;text-transform:none;\n    letter-spacing:-.01em;color:var(--ink);margin:0;\n  }\n  .fd-modal-close{\n    width:40px;height:40px;border-radius:13px;border:1px solid var(--line-2);\n    background:#fff;color:var(--ink-soft);font-size:16px;cursor:pointer;\n  }\n  .fd-modal-section{\n    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);\n    padding:18px;margin-bottom:14px;\n  }\n  .fd-modal-section h4{\n    font-family:var(--disp);font-weight:700;font-size:11.5px;letter-spacing:.08em;\n    text-transform:uppercase;color:var(--ink-mute);margin:0 0 14px;\n  }\n  .fd-admin-row{display:flex;gap:8px;margin-bottom:10px;}\n  .fd-admin-row input{flex:1;padding:12px 14px;font-size:16px;font-family:var(--sans);border:1.5px solid var(--line-2);border-radius:11px;}\n  .fd-admin-del{\n    width:48px;height:48px;flex-shrink:0;border-radius:11px;border:1.5px solid #E9BEB9;\n    background:var(--red-bg);color:var(--red);font-size:16px;cursor:pointer;\n  }\n  .fd-admin-empty{font-size:13px;color:var(--ink-mute);margin-bottom:10px;}\n  .fd-add-btn{\n    font-family:var(--sans);font-weight:700;font-size:15px;padding:0 18px;border-radius:11px;\n    border:1.5px solid var(--steel);background:var(--steel);color:#fff;cursor:pointer;\n    white-space:nowrap;min-height:48px;\n  }\n\n  @media (max-width:640px){\n    .fd-grid{grid-template-columns:1fr;}\n    .fd-actions{grid-template-columns:1fr 1fr;}\n    .fd-title{font-size:24px;}\n  }\n  @media (max-width:420px){\n    .fd-actions{grid-template-columns:1fr;}\n  }\n\n  /* ---------- Champ en erreur ---------- */\n  .fd-invalid{\n    border-color:var(--red)!important;\n    box-shadow:0 0 0 4px rgba(179,64,58,.14)!important;\n    background:#FFFCFC!important;\n  }\n  .fd-flag{\n    border-radius:14px;\n    box-shadow:0 0 0 2px var(--red),0 0 0 6px rgba(179,64,58,.13);\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<div class=\"fd-wrap\">\n  <div class=\"fd-ticket\">\n    <div class=\"fd-eyebrow\"><span>RECORD · MAINTENANCE TRAVAUX<\u002Fspan><span id=\"fd-ticket-no\">FQ —<\u002Fspan><\u002Fdiv>\n    <div class=\"fd-title\">Demande de devis<\u002Fdiv>\n    <div class=\"fd-sub\">Relevé technicien à compléter sur site<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"fd-body\">\n\n    <div class=\"fd-section\">\n      <div class=\"fd-section-head\"><span class=\"fd-num\">1<\u002Fspan><span class=\"fd-section-title\">Intervention<\u002Fspan><\u002Fdiv>\n      <div class=\"fd-grid\">\n        <div class=\"fd-field\">\n          <label>Technicien <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <input type=\"text\" id=\"f-tech\" list=\"dl-tech\" placeholder=\"Nom du technicien\" autocomplete=\"off\">\n          <datalist id=\"dl-tech\"><\u002Fdatalist>\n        <\u002Fdiv>\n        <div class=\"fd-field full\"><label>Nom du site / Ville <span class=\"req\">*<\u002Fspan><\u002Flabel><input type=\"text\" id=\"f-site\" placeholder=\"Ex. Entrepôt Logidis, Aubagne\"><\u002Fdiv>\n        <div class=\"fd-field full\">\n          <label>Mail client <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <input type=\"email\" id=\"f-mail\" placeholder=\"contact@client.fr\">\n          <div class=\"fd-photo-hint\">Info à titre indicatif, reprise dans le texte — ce n'est pas l'adresse de destination de l'envoi.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fd-field full\">\n          <label>Destinataire (envoi du mail)<\u002Flabel>\n          <input type=\"email\" id=\"f-dest\" list=\"dl-dest\" placeholder=\"destinataire@record.fr\" autocomplete=\"off\">\n          <datalist id=\"dl-dest\"><\u002Fdatalist>\n          <div class=\"fd-photo-hint\">Utilisé pour pré-remplir automatiquement le \"à\" lors de l'envoi par mail (quand le partage photo n'est pas disponible).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"fd-section\">\n      <div class=\"fd-section-head\"><span class=\"fd-num\">2<\u002Fspan><span class=\"fd-section-title\">Équipement<\u002Fspan><\u002Fdiv>\n      <div class=\"fd-grid\">\n        <div class=\"fd-field\"><label>N° équipement <span class=\"req\">*<\u002Fspan><\u002Flabel><input type=\"text\" class=\"fd-mono\" id=\"f-equip\" placeholder=\"EQ-000000\"><\u002Fdiv>\n        <div class=\"fd-field\"><label>N° FQ<\u002Flabel><input type=\"text\" class=\"fd-mono\" id=\"f-fq\" placeholder=\"FQ-000000\"><\u002Fdiv>\n        <div class=\"fd-field full\"><label>Localisation<\u002Flabel><input type=\"text\" id=\"f-loc\" placeholder=\"Bâtiment / quai / porte n°\"><\u002Fdiv>\n        <div class=\"fd-field\"><label>Marque<\u002Flabel><input type=\"text\" id=\"f-marque\" placeholder=\"Ex. Record\"><\u002Fdiv>\n        <div class=\"fd-field\"><label>Modèle<\u002Flabel><input type=\"text\" id=\"f-modele\" placeholder=\"Ex. Speedor 2\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"fd-section\">\n      <div class=\"fd-section-head\"><span class=\"fd-num\">3<\u002Fspan><span class=\"fd-section-title\">Moyens &amp; statut<\u002Fspan><\u002Fdiv>\n      <div class=\"fd-grid\">\n        <div class=\"fd-field\"><label>Temps par technicien (heures) <span class=\"req\">*<\u002Fspan><\u002Flabel><input type=\"number\" step=\"0.5\" min=\"0\" id=\"f-temps\" placeholder=\"0\"><\u002Fdiv>\n        <div class=\"fd-field\"><label>Nombre de techniciens <span class=\"req\">*<\u002Fspan><\u002Flabel><input type=\"number\" step=\"1\" min=\"1\" id=\"f-nbtech\" placeholder=\"1\"><\u002Fdiv>\n        <div class=\"fd-field\"><label>Nacelle nécessaire <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"fd-toggle-row\">\n            <div class=\"fd-toggle\" data-field=\"nacelle\" data-val=\"oui\">Oui<\u002Fdiv>\n            <div class=\"fd-toggle\" data-field=\"nacelle\" data-val=\"non\">Non<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fd-field\"><label>PIRL nécessaire <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"fd-toggle-row\">\n            <div class=\"fd-toggle\" data-field=\"pirl\" data-val=\"oui\">Oui<\u002Fdiv>\n            <div class=\"fd-toggle\" data-field=\"pirl\" data-val=\"non\">Non<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fd-field full\"><label>Statut de l'intervention <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"fd-chip-row\">\n            <div class=\"fd-chip\" data-type=\"arret\">Porte à l'arrêt<\u002Fdiv>\n            <div class=\"fd-chip\" data-type=\"urgent\">Urgent<\u002Fdiv>\n            <div class=\"fd-chip\" data-type=\"preventif\">Préventif<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"fd-section\">\n      <div class=\"fd-section-head\"><span class=\"fd-num\">4<\u002Fspan><span class=\"fd-section-title\">Pièces &amp; photos<\u002Fspan><\u002Fdiv>\n      <div class=\"fd-field full\">\n        <label>Descriptif des pièces (référence si possible) <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <textarea id=\"f-pieces\" placeholder=\"Ex. Moteur tri 0.75kW réf. XXXX, courroie crantée réf. XXXX...\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"fd-field full\">\n        <label>Photos <span class=\"req\">*<\u002Fspan> (au moins 1 obligatoire)<\u002Flabel>\n        <div class=\"fd-photo-actions\">\n          <label class=\"fd-photo-btn\" for=\"f-photo-input\">📷 Prendre / ajouter une photo<\u002Flabel>\n          <input type=\"file\" id=\"f-photo-input\" accept=\"image/*\" multiple=\"\" style=\"display:none;\">\n        <\u002Fdiv>\n        <div class=\"fd-photo-hint\">Les photos seront jointes directement au partage (mail, WhatsApp...).<\u002Fdiv>\n        <div class=\"fd-photo-grid\" id=\"fd-photo-grid\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"fd-actions\">\n      <button class=\"fd-btn\" id=\"btn-mail\">Partager (PDF + photos)<\u002Fbutton>\n      <button class=\"fd-btn secondary\" id=\"btn-pdf\">Télécharger le PDF<\u002Fbutton>\n      <button class=\"fd-btn secondary\" id=\"btn-copy\">Copier le texte<\u002Fbutton>\n      <button class=\"fd-btn ghost\" id=\"btn-new\">Nouvelle fiche<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"fd-photo-hint\" style=\"text-align:center;margin-top:8px;\">Le PDF reprend la mise en forme complète de la fiche, photos incluses.<\u002Fdiv>\n    <div class=\"fd-msg\" id=\"fd-msg\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"fd-footer-credit\">\n  <div class=\"fd-credit-label\">Réalisation<\u002Fdiv>\n  <div class=\"fd-credit-name\">Christophe BATAILLE<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  const $ = id => document.getElementById(id);\n  const fields = ['tech','site','mail','dest','equip','fq','loc','marque','modele','temps','nbtech','pieces'];\n  let toggles = { nacelle:null, pirl:null };\n  let chips = { arret:false, urgent:false, preventif:false };\n  let photos = []; // dataURLs (jpeg compressés)\n\n  function resizeImage(file){\n    return new Promise((resolve)=>{\n      const reader = new FileReader();\n      reader.onload = function(e){\n        const img = new Image();\n        img.onload = function(){\n          const maxDim = 1280;\n          let w = img.width, h = img.height;\n          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }\n          else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }\n          const canvas = document.createElement('canvas');\n          canvas.width = w; canvas.height = h;\n          canvas.getContext('2d').drawImage(img, 0, 0, w, h);\n          resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.65), w, h });\n        };\n        img.onerror = function(){ resolve(null); };\n        img.src = e.target.result;\n      };\n      reader.onerror = function(){ resolve(null); };\n      reader.readAsDataURL(file);\n    });\n  }\n\n  function photoOf(p){\n    return (p && typeof p === 'object') ? p : { dataUrl: p, w: 4, h: 3 };\n  }\n\n  function renderPhotoGrid(){\n    const grid = $('fd-photo-grid');\n    grid.innerHTML = '';\n    photos.forEach((p, i)=>{\n      const ph = photoOf(p);\n      const div = document.createElement('div');\n      div.className = 'fd-photo-thumb';\n      div.innerHTML = '<img src=\"'+ph.dataUrl+'\" alt=\"photo\"><button type=\"button\" class=\"fd-photo-del\" data-i=\"'+i+'\">✕<\u002Fbutton>';\n      grid.appendChild(div);\n    });\n    grid.querySelectorAll('.fd-photo-del').forEach(btn=>{\n      btn.addEventListener('click', ()=>{\n        photos.splice(parseInt(btn.dataset.i,10), 1);\n        renderPhotoGrid();\n      });\n    });\n  }\n\n  $('f-photo-input').addEventListener('change', async (e)=>{\n    const files = Array.from(e.target.files || []);\n    for(const file of files){\n      const result = await resizeImage(file);\n      if(result) photos.push(result);\n    }\n    renderPhotoGrid();\n    e.target.value = '';\n  });\n\n  function dataUrlToFileSync(dataUrl, name){\n    const parts = dataUrl.split(',');\n    const mimeMatch = parts[0].match(/data:(.*?);base64/);\n    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';\n    const binary = atob(parts[1]);\n    const len = binary.length;\n    const bytes = new Uint8Array(len);\n    for(let i=0;i<len;i++){ bytes[i] = binary.charCodeAt(i); }\n    return new File([bytes], name, { type: mime });\n  }\n\n  function generateFichePDF(data){\n    if(!window.jspdf || !window.jspdf.jsPDF){\n      throw new Error('Bibliothèque PDF non disponible (hors-ligne ?)');\n    }\n\n    const { jsPDF } = window.jspdf;\n    const doc = new jsPDF({ unit:'mm', format:'a4' });\n    const pageW = doc.internal.pageSize.getWidth();\n    const pageH = doc.internal.pageSize.getHeight();\n    const margin = 18;\n    const contentW = pageW - margin*2;\n    const LABEL_X = 66;\n    let y = 0;\n\n    const STEEL=[30,52,72], INK=[18,23,28], SOFT=[100,110,120], LINE=[226,230,235],\n          SURF=[246,248,250], AMBER=[200,129,26], RED=[179,64,58], REDBG=[251,234,232],\n          GREEN=[63,122,70], GREENBG=[233,241,234];\n\n    const dateStr = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });\n\n    function setC(c){ doc.setTextColor(c[0],c[1],c[2]); }\n    function fillC(c){ doc.setFillColor(c[0],c[1],c[2]); }\n    function drawC(c){ doc.setDrawColor(c[0],c[1],c[2]); }\n\n    function header(){\n      fillC(STEEL);\n      doc.rect(0,0,pageW,46,'F');\n      fillC(AMBER);\n      doc.rect(0,46,pageW,1.4,'F');\n      doc.setFont('helvetica','bold'); doc.setFontSize(8);\n      doc.setTextColor(150,175,196);\n      doc.text(\"RECORD  ·  MAINTENANCE TRAVAUX\", margin, 15, { charSpace:0.7 });\n      doc.setTextColor(255,255,255); doc.setFontSize(20);\n      doc.text(\"Demande de devis\", margin, 29);\n      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);\n      doc.setTextColor(180,198,213);\n      doc.text((data.site || 'Site non renseigné') + '   \\u00B7   ' + dateStr, margin, 38, { maxWidth: contentW - 50 });\n      const ref = data.fq ? 'FQ ' + data.fq : 'FQ \\u2014';\n      doc.setFont('helvetica','bold'); doc.setFontSize(10);\n      const rw = doc.getTextWidth(ref) + 13;\n      doc.setDrawColor(118,146,170); doc.setLineWidth(0.5);\n      doc.roundedRect(pageW - margin - rw, 19.5, rw, 11.5, 3.5, 3.5, 'S');\n      doc.setTextColor(255,255,255);\n      doc.text(ref, pageW - margin - rw/2, 27.2, { align:'center' });\n      y = 62;\n      setC(INK);\n    }\n\n    function checkBreak(need){\n      if(y + need > pageH - 24){ doc.addPage(); y = 26; }\n    }\n\n    function section(title){\n      checkBreak(30);\n      y += 3;\n      doc.setFont('helvetica','bold'); doc.setFontSize(9);\n      setC(STEEL);\n      doc.text(title.toUpperCase(), margin, y, { charSpace:0.9 });\n      y += 3.6;\n      drawC(LINE); doc.setLineWidth(0.4);\n      doc.line(margin, y, pageW - margin, y);\n      y += 7;\n      setC(INK);\n    }\n\n    function row(label, value){\n      const val = (value === undefined || value === null || value === '') ? '\\u2014' : String(value);\n      doc.setFont('helvetica','normal'); doc.setFontSize(11);\n      const lines = doc.splitTextToSize(val, contentW - LABEL_X - 8);\n      const h = Math.max(13.5, lines.length * 5.8 + 7.6);\n      checkBreak(h + 4);\n      fillC(SURF);\n      doc.roundedRect(margin, y, contentW, h, 2.5, 2.5, 'F');\n      doc.setFont('helvetica','bold'); doc.setFontSize(7.8);\n      setC(SOFT);\n      doc.text(label.toUpperCase(), margin + 7, y + 8.6, { charSpace:0.35, maxWidth: LABEL_X - 12 });\n      doc.setFont('helvetica','normal'); doc.setFontSize(11);\n      setC(INK);\n      doc.text(lines, margin + LABEL_X, y + 8.8);\n      y += h + 3.4;\n    }\n\n    function block(label, value){\n      const val = (value === undefined || value === null || value === '') ? '\\u2014' : String(value);\n      doc.setFont('helvetica','normal'); doc.setFontSize(11);\n      const lines = doc.splitTextToSize(val, contentW - 14);\n      const h = 15 + lines.length * 5.8;\n      checkBreak(h + 4);\n      fillC(SURF);\n      doc.roundedRect(margin, y, contentW, h, 2.5, 2.5, 'F');\n      doc.setFont('helvetica','bold'); doc.setFontSize(7.8); setC(SOFT);\n      doc.text(label.toUpperCase(), margin + 7, y + 8.4, { charSpace:0.35 });\n      doc.setFont('helvetica','normal'); doc.setFontSize(11); setC(INK);\n      doc.text(lines, margin + 7, y + 16.5);\n      y += h + 3.4;\n    }\n\n    function callout(label, value, tone){\n      const bg = tone === 'red' ? REDBG : GREENBG;\n      const fg = tone === 'red' ? RED : GREEN;\n      const val = (value === undefined || value === null || value === '') ? '\\u2014' : String(value);\n      doc.setFont('helvetica','bold'); doc.setFontSize(13.5);\n      const lines = doc.splitTextToSize(val, contentW - 16);\n      const h = 17 + lines.length * 6.4;\n      checkBreak(h + 5);\n      fillC(bg);\n      doc.roundedRect(margin, y, contentW, h, 3, 3, 'F');\n      fillC(fg);\n      doc.rect(margin, y, 1.8, h, 'F');\n      doc.setFont('helvetica','bold'); doc.setFontSize(7.8); setC(fg);\n      doc.text(label.toUpperCase(), margin + 8, y + 8.6, { charSpace:0.4 });\n      doc.setFontSize(13.5);\n      doc.text(lines, margin + 8, y + 17);\n      y += h + 4;\n    }\n\n    function tiles(items){\n      const gap = 4.5;\n      const w = (contentW - gap * (items.length - 1)) / items.length;\n      checkBreak(24);\n      items.forEach((it, i)=>{\n        const x = margin + i * (w + gap);\n        fillC(SURF);\n        doc.roundedRect(x, y, w, 19, 2.5, 2.5, 'F');\n        doc.setFont('helvetica','bold'); doc.setFontSize(7.2); setC(SOFT);\n        doc.text(it.k.toUpperCase(), x + 5.5, y + 7, { charSpace:0.35 });\n        doc.setFontSize(12.5); setC(INK);\n        doc.text(String(it.v || '\\u2014'), x + 5.5, y + 15);\n      });\n      y += 23;\n    }\n\n    function pills(list){\n      if(!list.length){ row('Statut', ''); return; }\n      checkBreak(15);\n      let x = margin;\n      list.forEach(it=>{\n        doc.setFont('helvetica','bold'); doc.setFontSize(9);\n        const w = doc.getTextWidth(it.t.toUpperCase()) + 11;\n        if(x + w > pageW - margin){ x = margin; y += 12; }\n        fillC(it.tone === 'red' ? REDBG : GREENBG);\n        doc.roundedRect(x, y, w, 9.5, 4.75, 4.75, 'F');\n        setC(it.tone === 'red' ? RED : GREEN);\n        doc.text(it.t.toUpperCase(), x + w/2, y + 6.4, { align:'center', charSpace:0.3 });\n        x += w + 5;\n      });\n      y += 14;\n    }\n\n    function photosPages(list){\n      if(!list || !list.length) return;\n      doc.addPage(); y = 26;\n      doc.setFont('helvetica','bold'); doc.setFontSize(9); setC(STEEL);\n      doc.text('PHOTOS  \\u00B7  ' + list.length, margin, y, { charSpace:0.9 });\n      y += 3.6;\n      drawC(LINE); doc.setLineWidth(0.4);\n      doc.line(margin, y, pageW - margin, y);\n      y += 8;\n      const gap = 6, cellW = (contentW - gap) / 2, cellH = cellW * 0.8;\n      let col = 0;\n      list.forEach((p, i)=>{\n        const ph = photoOf(p);\n        if(col === 0) checkBreak(cellH + 13);\n        const x = margin + col * (cellW + gap);\n        fillC(SURF);\n        doc.roundedRect(x, y, cellW, cellH, 2.5, 2.5, 'F');\n        const ratio = (ph.w || 4) / (ph.h || 3);\n        let iw = cellW - 5, ih = iw / ratio;\n        if(ih > cellH - 5){ ih = cellH - 5; iw = ih * ratio; }\n        try{ doc.addImage(ph.dataUrl, 'JPEG', x + (cellW - iw)/2, y + (cellH - ih)/2, iw, ih); }catch(err){}\n        doc.setFont('helvetica','bold'); doc.setFontSize(7.2); setC(SOFT);\n        doc.text('PHOTO ' + (i+1), x, y + cellH + 5.2, { charSpace:0.4 });\n        col++;\n        if(col === 2){ col = 0; y += cellH + 12; }\n      });\n      if(col === 1) y += cellH + 12;\n    }\n\n    function footers(){\n      const total = doc.internal.getNumberOfPages();\n      for(let p = 1; p <= total; p++){\n        doc.setPage(p);\n        drawC(LINE); doc.setLineWidth(0.4);\n        doc.line(margin, pageH - 15, pageW - margin, pageH - 15);\n        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); setC(SOFT);\n        doc.text('Réalisation Christophe BATAILLE  \\u00B7  ' + dateStr, margin, pageH - 10);\n        doc.text('Page ' + p + ' / ' + total, pageW - margin, pageH - 10, { align:'right' });\n      }\n    }\n\n    header();\n\n    section('Intervention');\n    row('Technicien', data.tech);\n    row('Site / Ville', data.site);\n    row('Mail client', data.mail);\n\n    section('Équipement');\n    tiles([\n      { k:'N° équipement', v:data.equip },\n      { k:'N° FQ', v:data.fq },\n    ]);\n    row('Localisation', data.loc);\n    row('Marque / Modèle', [data.marque, data.modele].filter(Boolean).join(' ') || '');\n\n    section('Moyens \\u00E0 prévoir');\n    tiles([\n      { k:'Temps / technicien', v:(data.temps ? data.temps + ' h' : '') },\n      { k:'Nb techniciens', v:data.nbtech },\n      { k:'Nacelle', v:data.toggles.nacelle },\n      { k:'PIRL', v:data.toggles.pirl },\n    ]);\n\n    section(\"Statut de l'intervention\");\n    pills(statusLabel(data).map(t=>({ t:t, tone:(t === 'Préventif' ? 'green' : 'red') })));\n\n    section('Pièces à devis');\n    block('Descriptif', data.pieces);\n\n    photosPages(data.photos);\n    footers();\n\n    return doc;\n  }\n\n  // --- Stockage local (fonctionne hors-ligne, propre à cette tablette/navigateur) ---\n  function lsGet(key){\n    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }\n  }\n  function lsSet(key, val){\n    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}\n  }\n\n  // --- Listes préenregistrées (gérées depuis la page d'accueil > Administration) ---\n  const TECH_KEY = 'techniciens-preenregistres';\n  const DEST_KEY = 'destinataires-preenregistres';\n\n  function loadPreList(key){ return lsGet(key) || []; }\n\n  function refreshDatalist(datalistId, key){\n    const dl = $(datalistId);\n    const list = loadPreList(key);\n    dl.innerHTML = list.map(v => '<option value=\"'+v.replace(/\"/g,'&quot;')+'\"><\u002Foption>').join('');\n  }\n\n  function refreshAllDatalists(){\n    refreshDatalist('dl-tech', TECH_KEY);\n    refreshDatalist('dl-dest', DEST_KEY);\n  }\n  refreshAllDatalists();\n\n  document.querySelectorAll('.fd-toggle').forEach(t=>{\n    t.addEventListener('click', ()=>{\n      const field = t.dataset.field;\n      document.querySelectorAll('.fd-toggle[data-field=\"'+field+'\"]').forEach(x=>x.classList.remove('on'));\n      t.classList.add('on');\n      toggles[field] = t.dataset.val;\n    });\n  });\n\n  document.querySelectorAll('.fd-chip').forEach(c=>{\n    c.addEventListener('click', ()=>{\n      const type = c.dataset.type;\n      chips[type] = !chips[type];\n      c.classList.toggle('on', chips[type]);\n    });\n  });\n\n  function readForm(){\n    const data = { toggles: {...toggles}, chips: {...chips}, photos: [...photos] };\n    fields.forEach(f => data[f] = $('f-'+f).value.trim());\n    return data;\n  }\n\n  function resetForm(){\n    fields.forEach(f => $('f-'+f).value = '');\n    photos = [];\n    renderPhotoGrid();\n    toggles = { nacelle:null, pirl:null };\n    chips = { arret:false, urgent:false, preventif:false };\n    document.querySelectorAll('.fd-toggle').forEach(t=>t.classList.remove('on'));\n    document.querySelectorAll('.fd-chip').forEach(c=>c.classList.remove('on'));\n    $('fd-ticket-no').textContent = 'FQ —';\n  }\n\n  $('f-fq').addEventListener('input', ()=>{\n    const v = $('f-fq').value.trim();\n    $('fd-ticket-no').textContent = v ? 'FQ ' + v : 'FQ —';\n  });\n\n  function statusLabel(data){\n    const l = [];\n    if(data.chips.arret) l.push(\"Porte à l'arrêt\");\n    if(data.chips.urgent) l.push('Urgent');\n    if(data.chips.preventif) l.push('Préventif');\n    return l;\n  }\n\n  function formatText(data, opts){\n    opts = opts || {};\n    const dateStr = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });\n    const statuts = statusLabel(data).join('  \\u00B7  ') || '\\u2014';\n    const nbtechDisplay = opts.forceZeroTech ? '0' : (data.nbtech || '\\u2014');\n    const L = [];\n    const rule = '\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500';\n    function bloc(titre, lignes){\n      L.push('');\n      L.push(titre.toUpperCase());\n      L.push(rule);\n      lignes.filter(Boolean).forEach(l => L.push(l));\n    }\n    function kv(k, v){ return k + ' : ' + (v || '\\u2014'); }\n\n    L.push('DEMANDE DE DEVIS');\n    L.push(rule);\n    L.push(data.site || 'Site non renseigné');\n    L.push((data.fq ? 'FQ ' + data.fq + '  \\u00B7  ' : '') + dateStr);\n    L.push('Statut : ' + statuts);\n\n    bloc('Intervention', [\n      kv('Technicien', data.tech),\n      kv('Mail client', data.mail),\n    ]);\n\n    bloc('Équipement', [\n      kv('N° équipement', data.equip),\n      data.fq ? kv('N° FQ', data.fq) : null,\n      data.loc ? kv('Localisation', data.loc) : null,\n      kv('Marque / Modèle', [data.marque, data.modele].filter(Boolean).join(' ')),\n    ]);\n\n    bloc('Moyens à prévoir', [\n      kv('Temps par technicien', (data.temps ? data.temps + ' h' : '')),\n      kv('Nombre de techniciens', nbtechDisplay),\n      kv('Nacelle', data.toggles.nacelle),\n      kv('PIRL', data.toggles.pirl),\n    ]);\n\n    bloc('Pièces à devis', [ (data.pieces || '\\u2014') ]);\n\n    if(opts.notePhotos || opts.note){\n      const lignes = [];\n      if(opts.notePhotos){\n        lignes.push(data.photos && data.photos.length\n          ? data.photos.length + ' photo(s) à joindre manuellement'\n          : 'Aucune photo');\n      }\n      if(opts.note) lignes.push(opts.note);\n      bloc('Pièces jointes', lignes);\n    }\n\n    L.push('');\n    L.push('\\u2014 Relevé technicien RECORD');\n    return L.join('\\n');\n  }\n\n  let msgTimeout = null;\n  function showMsg(text, ok, noScroll){\n    const el = $('fd-msg');\n    el.textContent = (ok===false ? '⚠️ ' : '✓ ') + text;\n    el.className = 'fd-msg show ' + (ok===false ? 'error' : 'success');\n    if(!noScroll) el.scrollIntoView({ behavior:'smooth', block:'center' });\n    clearTimeout(msgTimeout);\n    msgTimeout = setTimeout(()=>{ el.classList.remove('show'); }, ok===false ? 7000 : 3500);\n  }\n\n  function clearFlags(){\n    document.querySelectorAll('.fd-invalid,.fd-flag').forEach(e=>{\n      e.classList.remove('fd-invalid');\n      e.classList.remove('fd-flag');\n    });\n  }\n\n  function highlight(sel){\n    clearFlags();\n    if(!sel) return;\n    const el = document.querySelector(sel);\n    if(!el) return;\n    const isInput = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);\n    const box = isInput ? el : (el.closest('.fd-toggle-row, .fd-chip-row, .fd-visual-grid, .fd-panel-box, .fd-photo-actions') || el);\n    box.classList.add(isInput ? 'fd-invalid' : 'fd-flag');\n    const r = box.getBoundingClientRect();\n    window.scrollTo({ top: Math.max(0, window.pageYOffset + r.top - 110), behavior:'smooth' });\n    if(isInput && typeof el.focus === 'function'){ try{ el.focus({ preventScroll:true }); }catch(e){ } }\n  }\n\n  document.addEventListener('input', clearFlags, true);\n  document.addEventListener('change', clearFlags, true);\n  document.addEventListener('click', (e)=>{\n    if(e.target && e.target.closest && e.target.closest('.fd-flag')) clearFlags();\n  }, true);\n\n  function validate(data){\n    if(!data.tech) return { msg:'Le technicien est obligatoire.', target:'#f-tech' };\n    if(!data.site) return { msg:'Le nom du site est obligatoire.', target:'#f-site' };\n    if(!data.equip) return { msg:\"Le n° d'équipement est obligatoire.\", target:'#f-equip' };\n    if(!data.mail) return { msg:'Le mail client est obligatoire.', target:'#f-mail' };\n    if(!data.temps) return { msg:'Le temps par technicien est obligatoire.', target:'#f-temps' };\n    if(!data.nbtech) return { msg:'Le nombre de techniciens est obligatoire.', target:'#f-nbtech' };\n    if(!toggles.nacelle) return { msg:'Merci de préciser si une nacelle est nécessaire.', target:'.fd-toggle[data-field=\"nacelle\"]' };\n    if(!toggles.pirl) return { msg:'Merci de préciser si un PIRL est nécessaire.', target:'.fd-toggle[data-field=\"pirl\"]' };\n    if(!data.chips.arret && !data.chips.urgent && !data.chips.preventif) return { msg:\"Le statut de l'intervention est obligatoire.\", target:'.fd-chip-row' };\n    if(!data.pieces) return { msg:'Le descriptif des pièces est obligatoire.', target:'#f-pieces' };\n    if(!data.photos || !data.photos.length) return { msg:'Au moins une photo est obligatoire.', target:'.fd-photo-btn' };\n    return null;\n  }\n\n  $('btn-new').addEventListener('click', ()=>{\n    resetForm();\n    showMsg('Nouvelle fiche prête.');\n  });\n\n  $('btn-copy').addEventListener('click', async ()=>{\n    const text = formatText(readForm(), { notePhotos:true });\n    try{\n      await navigator.clipboard.writeText(text);\n      showMsg('Texte copié dans le presse-papiers.');\n    }catch(e){\n      showMsg(\"Copie impossible sur cet appareil.\", false);\n    }\n  });\n\n  $('btn-mail').addEventListener('click', ()=>{\n    const data = readForm();\n    const err = validate(data);\n    if(err){ showMsg(err.msg, false, true); highlight(err.target); return; }\n    const subject = 'Demande de devis - ' + (data.site||'Site') + (data.fq ? ' - FQ '+data.fq : '');\n\n    let pdfFile = null;\n    try{\n      const pdfDoc = generateFichePDF(data);\n      const blob = pdfDoc.output('blob');\n      pdfFile = new File([blob], 'devis-' + (data.fq || data.site || 'fiche').replace(/[^a-z0-9-]+/gi,'_') + '.pdf', { type:'application/pdf' });\n    }catch(e){\n      showMsg(\"Le PDF n'a pas pu être généré (\" + (e.message||'erreur') + \") — utilise \\\"Copier le texte\\\" en secours.\", false);\n      return;\n    }\n\n    if(navigator.share){\n      const filesAttached = !!(navigator.canShare && navigator.canShare({ files:[pdfFile] }));\n      const note = filesAttached\n        ? '📎 Détails complets et photos dans le PDF joint.'\n        : '📎 PDF à télécharger (bouton dédié) et à joindre manuellement.';\n      const text = formatText(data, { forceZeroTech:true, note: note });\n      const shareData = { title: subject, text: text };\n      if(filesAttached){\n        shareData.files = [pdfFile];\n      }\n      navigator.share(shareData).then(()=>{\n        showMsg('Partage envoyé.');\n      }).catch(e=>{\n        if(e && e.name === 'AbortError') return; // annulé par l'utilisateur\n        const detail = (e && e.message) ? e.message : (e && e.name) ? e.name : 'erreur inconnue';\n        showMsg('Le partage a échoué (' + detail + ') — utilise \"Télécharger le PDF\" puis joins-le manuellement.', false);\n      });\n    } else {\n      const text = formatText(data, { forceZeroTech:true, note: '📎 PDF à télécharger (bouton dédié) et à joindre manuellement.' });\n      try{\n        const url = 'mailto:' + encodeURIComponent(data.dest||'') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);\n        const a = document.createElement('a');\n        a.href = url; a.rel = 'noopener';\n        document.body.appendChild(a); a.click(); document.body.removeChild(a);\n        showMsg(\"Mail ouvert — le PDF n'est pas joint automatiquement ici : clique \\\"Télécharger le PDF\\\" puis joins-le à la main.\", false);\n      }catch(e){\n        showMsg(\"Partage indisponible sur cet appareil — utilise \\\"Télécharger le PDF\\\".\", false);\n      }\n    }\n  });\n\n  $('btn-pdf').addEventListener('click', ()=>{\n    const data = readForm();\n    const err = validate(data);\n    if(err){ showMsg(err.msg, false, true); highlight(err.target); return; }\n    try{\n      const pdfDoc = generateFichePDF(data);\n      pdfDoc.save('devis-' + (data.fq || data.site || 'fiche').replace(/[^a-z0-9-]+/gi,'_') + '.pdf');\n      showMsg('PDF téléchargé — tu peux le joindre manuellement à ton mail.');\n    }catch(e){\n      showMsg(\"Le PDF n'a pas pu être généré (\" + (e.message||'erreur') + \").\", false);\n    }\n  });\n\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
