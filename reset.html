<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réinitialiser l'application — RECORD</title>
<style>
  body{margin:0;background:#EDEFF3;color:#12171C;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px;line-height:1.5;}
  .box{max-width:520px;margin:0 auto;background:#fff;border:1px solid #E3E6EB;border-radius:16px;padding:24px;box-shadow:0 1px 2px rgba(18,23,28,.05),0 12px 30px -20px rgba(18,23,28,.45);}
  h1{font-size:20px;margin:0 0 8px;letter-spacing:-.01em;}
  p{font-size:14.5px;color:#5A646E;margin:0 0 18px;}
  #log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#F6F8FA;border:1px solid #E3E6EB;border-radius:10px;padding:14px;white-space:pre-wrap;color:#12171C;margin-bottom:18px;}
  a.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:12px;background:#1E3448;color:#fff;font-weight:700;font-size:15.5px;text-decoration:none;}
  a.btn:hover{background:#2F5674;color:#fff;}
</style>
</head>
<body>
<div class="box">
  <h1>Réinitialisation de l'application</h1>
  <p>Cette page supprime la version en mémoire de l'appareil et force le rechargement de la dernière version publiée.</p>
  <div id="log">Nettoyage en cours…</div>
  <a class="btn" href="index.html">Ouvrir la dernière version</a>
</div>
<script>
(async function(){
  const log = document.getElementById('log');
  const lines = [];
  const say = t => { lines.push(t); log.textContent = lines.join('\n'); };
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ await r.unregister(); }
      say('✓ Application désinstallée (' + regs.length + ')');
    } else { say('· Pas d\'application installée'); }
  }catch(e){ say('⚠ ' + e.message); }
  try{
    if(window.caches){
      const keys = await caches.keys();
      for(const k of keys){ await caches.delete(k); }
      say('✓ Cache vidé (' + keys.length + ' élément(s))');
    }
  }catch(e){ say('⚠ ' + e.message); }
  say('');
  say('Terminé — touche le bouton ci-dessous.');
})();
</script>
</body>
</html>
